# Tests de pi-aristote sur chaque poussée : sans clé API ni réseau, avec les
# paquets d'une installation de pi 1.0.0, dans un HOME temporaire. La page et
# l'archive ne sont pas publiées d'ici : c'est le workflow Pages du dépôt
# l-pommeret/thegreeklibrary.org qui les sert sous /pi-aristote/ (voir le README).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer pi 1.0.0
        run: npm install -g --no-audit --no-fund @earendil-works/pi-coding-agent@1.0.0
      - name: Syntaxe des scripts shell
        run: |
          for s in sh dash bash; do "$s" -n install.sh; done
          sh -n test/run.sh
      - name: Tests unitaires
        run: |
          export HOME="$(mktemp -d)"
          unset ARISTOTE_API_KEY
          ./test/run.sh
