pages:
  image: alpine:latest
  script:
    - mkdir -p public
    - tar -czf public/pi-aristote.tar.gz extensions themes
    - cp install.sh site/* public/
    - cp extensions/aristote/VERSION public/VERSION
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
